{% extends "base.html" %}
{% block title %}{{ title }} - DoDoGo{% endblock %}
{% block body_attrs %}data-page="error"{% endblock %}
{% block body %}
<div class="error-page">
  <div class="auth-card">
    <div class="auth-brand">
      <img class="auth-logo" src="/static/assets/logo.png" alt="DoDoGo">
      <h1 class="auth-title">{{ title }}</h1>
      <p class="auth-sub">{{ message }}</p>
    </div>
    <a class="btn btn-primary btn-block" href="/">返回工作台</a>
  </div>
</div>
{% endblock %}
