{% extends "auth.html" %}
{% block title %}登录 - DoDoGo{% endblock %}
{% block body_attrs %}data-page="login"{% endblock %}
{% block auth_title %}登录{% endblock %}
{% block auth_sub %}使用用户名或邮箱登录 DoDoGo{% endblock %}
{% block auth_form %}
<form id="auth-form" class="auth-form" novalidate>
  <div class="field">
    <label for="login-identity">用户名 / 邮箱</label>
    <input id="login-identity" name="identity" type="text" class="input" required autocomplete="username" autofocus placeholder="username 或 name@example.com">
  </div>
  <div class="field">
    <label for="login-password">密码</label>
    <input id="login-password" name="password" type="password" class="input" required autocomplete="current-password" placeholder="请输入密码">
  </div>
  <label class="check-row"><input id="login-remember" name="remember" type="checkbox" checked> 记住我（30 天内免登录）</label>
  <button class="btn btn-primary btn-block" type="submit" id="login-submit">登 录</button>
  <p id="auth-error" class="auth-error" hidden></p>
  <p class="auth-alt">还没有账号？<a href="/register">立即注册</a></p>
</form>
{% endblock %}
